env:
  AWS_CLI_AUTO_PROMPT: on-partial

tasks:
  - name: cdk
    before: |
     npm i -g aws-cdk
     
  - name: terraform
    before: |
     ./bin/terraform_cli_install.sh
    
    
tasks:

      - name: utils
        before: |
          sudp apt-get install tree
                  
      - name: powershell
        before: |
                ./bin/powershell_cli_install.sh
      - name: Setup AWS CLI
        env:
          AWS_CLI_AUTO_PROMPT: on-partial
        before: |
          ./bin/aws_cli_install.sh